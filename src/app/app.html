<main class="page">
  <header class="hero">
    <h1>Lista de Tareas</h1>
    <p>Organiza tu dia y marca tu progreso.</p>
  </header>

  <section class="card">
    <app-task-input (tareaAgregada)="agregarTarea($event)"></app-task-input>
  </section>

  <section class="card list-card">
    <app-task-list [tareas]="tareas"></app-task-list>
  </section>
</main>
